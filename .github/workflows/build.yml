name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Stop Gradle
        working-directory: android
        run: ./gradlew --stop || true

      - name: Clean Project
        run: |
          flutter clean
          rm -rf android/.gradle
          rm -rf ~/.gradle/caches

      - name: Get Packages
        run: flutter pub get

      - name: Precache Flutter
        run: flutter precache --android

      - name: Kill Gradle
        run: pkill -f gradle || true

      - name: Build APK
        run: |
          flutter build apk --release --verbose
          echo "========== APK FILES =========="
          find . -name "*.apk" || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gowes-pulen-release
          path: |
            build/**/*.apk
            **/*.apk
