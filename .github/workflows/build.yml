name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Clean
        run: |
          flutter clean
          rm -rf android/.gradle
          rm -rf ~/.gradle/caches

      - name: Get Packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Show APK
        if: always()
        run: |
          echo "========== APK =========="
          find build -name "*.apk"
          echo "========== OUTPUT =========="
          ls -R build || true
          ls -R android/app/build || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gowes-pulen-release
          path: build/app/outputs/flutter-apk/app-release.apk
